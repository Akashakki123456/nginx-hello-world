apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-hello-world
  labels:
    app: nginx-hello-world

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: nginx-hello-world

  template:
    metadata:
      labels:
        app: nginx-hello-world

    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP
