apiVersion: v1
kind: Service

metadata:
  name: nginx-hello-world
  labels:
    app: nginx-hello-world

spec:
  type: {{ .Values.service.type }}

  selector:
    app: nginx-hello-world

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
